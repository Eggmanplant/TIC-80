name: Build

on:
  # main and pull requests, not every branch: pushing a branch and then opening
  # a pull request for it built the same commit twice, and the two runs do not
  # share a concurrency group (a push ref and a pull request ref are different),
  # so neither cancelled the other — 18 checks on one commit, for nine jobs.
  # A branch with no pull request yet still builds on demand, through the
  # dispatch below, and the release path comes in through `workflow_call`.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stubs:
        description: 'Build the per-language export stubs too (slow; the release matrix)'
        type: boolean
        default: false
  workflow_call:
    # The android job signs the release APK with these. A reusable workflow
    # receives no repository secrets unless its caller names them, so
    # release.yml has to pass them — and `required` makes a caller that does
    # not fail at the start of the run instead of inside the signing step.
    # Before 15.09 the passwords lived in the tree and reached every flavor
    # of this workflow alike; moving them into secrets cut the tag path off,
    # because that path is the only one that goes through a call.
    secrets:
      RELEASE_STORE_PASSWORD:
        required: true
      RELEASE_KEY_PASSWORD:
        required: true

# A new push supersedes the previous run on the same ref: cancel it instead
# of burning matrix runners on stale commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # === Android ===
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23
          add-to-path: false
          local-cache: true

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install 32-bit build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Build
        run: |
          cd build/android
          chmod +x gradlew
          # The signing passwords are repository secrets — the keystore path
          # and alias live in gradle.properties, the passwords never do. Fail
          # here rather than inside the signer: without them the release build
          # stops, and a step that produced no APK must not look like one that
          # produced a good one.
          #
          # A pull request from a fork is handed no secrets at all, so the two
          # checks below would fail it for a reason that has nothing to do with
          # the change (17.09). Such a run builds the release variant unsigned
          # instead: the android job still proves the code compiles, the APK
          # cannot be mistaken for a shipable one, and every other event — a
          # push, the tag call — signs exactly as before.
          ./gradlew assembleRelease -PUNSIGNED=1
          cp app/build/outputs/apk/release/app-release-unsigned.apk tic80.apk

        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-android"
          path: build/android/tic80.apk
